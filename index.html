<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<title>工作日程 v3</title>
<style>
  :root {
    --bg: #F3F4F8; --card: #FFFFFF; --text-primary: #1A1D26;
    --text-secondary: #6B7280; --text-muted: #9CA3AF;
    --brand: #4F6EF7; --brand-light: #EEF1FE;
    --success: #22C55E; --success-light: #ECFDF5;
    --warning: #F59E0B; --warning-light: #FFFBEB;
    --danger: #EF4444; --danger-light: #FEF2F2;
    --divider: #E5E7EB;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    --radius: 12px; --radius-sm: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
    background:var(--bg); color:var(--text-primary); line-height:1.5;
    min-height:100vh; -webkit-font-smoothing:antialiased;
  }
  .app { max-width:1100px; margin:0 auto; padding:20px 16px 80px; }

  /* Header */
  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
  .header-left h1 { font-size:22px; font-weight:700; letter-spacing:-0.3px; }
  .header-left .date { font-size:13px; color:var(--text-secondary); margin-top:2px; }
  .header-right { display:flex; gap:8px; align-items:center; }
  .icon-btn {
    width:36px; height:36px; border-radius:50%; border:1.5px solid var(--divider);
    background:var(--card); cursor:pointer; display:flex; align-items:center;
    justify-content:center; font-size:16px; transition:all .15s; color:var(--text-secondary);
  }
  .icon-btn:hover { border-color:var(--brand); color:var(--brand); }
  .cal-link {
    text-decoration:none; display:flex; align-items:center; gap:6px;
    padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600;
    background:var(--brand); color:#fff; border:1.5px solid var(--brand);
    cursor:pointer; transition:all .15s;
  }
  .cal-link:hover { opacity:.9; }

  /* Stats */
  .stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:24px; }
  .stat-card {
    background:var(--card); border-radius:var(--radius); padding:16px;
    box-shadow:var(--shadow-sm); border:1px solid var(--divider);
    cursor:pointer; transition:box-shadow .15s,border-color .15s,transform .1s;
  }
  .stat-card:hover { box-shadow:var(--shadow-md); border-color:var(--brand); transform:translateY(-2px); }
  .stat-card .label { font-size:11px; color:var(--text-muted); font-weight:600; text-transform:uppercase; letter-spacing:.5px; margin-bottom:4px; }
  .stat-card .value { font-size:26px; font-weight:800; line-height:1.2; }
  .stat-card .sub { font-size:11px; color:var(--text-secondary); margin-top:2px; }

  /* Today Panel */
  .today-panel {
    background:linear-gradient(135deg,#4F6EF7 0%,#7C5CFC 100%);
    border-radius:var(--radius); padding:20px; margin-bottom:24px;
    color:#fff; box-shadow:var(--shadow-md);
  }
  .today-panel .today-title {
    font-size:14px; font-weight:600; opacity:.85; margin-bottom:12px;
    display:flex; align-items:center; gap:6px;
  }
  .today-item {
    background:rgba(255,255,255,.15); backdrop-filter:blur(4px);
    border-radius:var(--radius-sm); padding:10px 14px;
    display:flex; align-items:flex-start; gap:10px;
    cursor:pointer; transition:background .15s; margin-bottom:8px;
  }
  .today-item:last-child { margin-bottom:0; }
  .today-item:hover { background:rgba(255,255,255,.25); }
  .today-item .ti-project { font-size:11px; font-weight:600; opacity:.75; margin-bottom:2px; }
  .today-item .ti-task { font-size:14px; font-weight:500; }
  .today-item .ti-icon {
    width:20px; height:20px; border-radius:50%;
    border:2px solid rgba(255,255,255,.5); flex-shrink:0; margin-top:1px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:all .15s;
  }
  .today-item .ti-icon:hover { border-color:#fff; background:rgba(255,255,255,.2); }
  .today-item .ti-icon.checked { background:rgba(255,255,255,.9); border-color:rgba(255,255,255,.9); }
  .today-item .ti-icon.checked::after { content:'✓'; color:#4F6EF7; font-size:12px; font-weight:700; }
  .today-item.done .ti-task { text-decoration:line-through; opacity:.5; }
  .today-empty { text-align:center; padding:16px; opacity:.7; font-size:14px; }

  /* Tab Filter */
  .tab-bar { display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap; }
  .tab-btn {
    padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600;
    border:1.5px solid var(--divider); background:var(--card);
    color:var(--text-secondary); cursor:pointer; transition:all .15s;
  }
  .tab-btn:hover { border-color:var(--brand); color:var(--brand); }
  .tab-btn.active { background:var(--brand); color:#fff; border-color:var(--brand); }

  /* Section & Group */
  .section { margin-bottom:24px; }
  .section-head { display:flex; align-items:center; gap:8px; margin-bottom:12px; }
  .section-head h2 { font-size:16px; font-weight:700; }
  .badge {
    display:inline-flex; align-items:center; justify-content:center;
    min-width:20px; height:20px; padding:0 6px; border-radius:10px;
    font-size:11px; font-weight:700;
  }
  .group-header {
    display:flex; align-items:center; gap:8px; margin:16px 0 10px;
    cursor:pointer; user-select:none;
  }
  .group-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .dot-construction { background:var(--success); }
  .dot-design { background:var(--brand); }
  .dot-idle { background:var(--text-muted); }
  .group-name { font-size:14px; font-weight:700; }
  .group-count { font-size:12px; color:var(--text-muted); }
  .group-arrow { margin-left:auto; font-size:12px; color:var(--text-muted); transition:transform .2s; }
  .group-header.collapsed .group-arrow { transform:rotate(-90deg); }
  .group-content {
    display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:10px; overflow:hidden; transition:max-height .3s ease,opacity .2s;
  }
  .group-content.hidden { max-height:0; opacity:0; margin:0; }

  /* Project Card */
  .p-card {
    background:var(--card); border-radius:var(--radius);
    border:1px solid var(--divider); box-shadow:var(--shadow-sm);
    overflow:hidden; transition:box-shadow .15s,border-color .15s;
  }
  .p-card:hover { box-shadow:var(--shadow-md); border-color:#D1D5DB; }
  .p-card-head {
    padding:14px 16px 10px; cursor:pointer;
    display:flex; align-items:flex-start; gap:10px;
  }
  .p-card-head .p-name { font-size:14px; font-weight:650; flex:1; line-height:1.4; }
  .p-agent {
    font-size:11px; color:var(--text-muted); background:#F3F4F6;
    padding:2px 8px; border-radius:4px; white-space:nowrap; flex-shrink:0;
  }
  .p-card-body {
    max-height:0; overflow:hidden; transition:max-height .3s ease,padding .2s;
    padding:0 16px;
  }
  .p-card-body.open { max-height:600px; padding:0 16px 14px; }
  .task-list { list-style:none; }
  .task-item {
    display:flex; align-items:flex-start; gap:8px; padding:6px 0;
    font-size:13px; border-bottom:1px solid #F3F4F6; line-height:1.4;
    cursor:pointer;
  }
  .task-item:last-child { border-bottom:none; }
  .task-item.done .task-text { text-decoration:line-through; color:var(--text-muted); }
  .task-checkbox {
    width:16px; height:16px; border-radius:4px; border:2px solid var(--divider);
    flex-shrink:0; margin-top:1px; display:flex; align-items:center;
    justify-content:center; cursor:pointer; transition:all .15s;
  }
  .task-checkbox:hover { border-color:var(--brand); }
  .task-checkbox.checked { background:var(--brand); border-color:var(--brand); }
  .task-checkbox.checked::after { content:'✓'; color:#fff; font-size:10px; font-weight:700; }
  .task-date {
    display:inline-flex; padding:1px 7px; border-radius:4px;
    font-size:11px; font-weight:600; white-space:nowrap;
    flex-shrink:0; min-width:48px; text-align:center;
  }
  .d-today { background:var(--danger-light); color:var(--danger); }
  .d-tomorrow { background:var(--warning-light); color:var(--warning); }
  .d-week { background:var(--brand-light); color:var(--brand); }
  .d-later { background:#F3F4F6; color:var(--text-muted); }
  .task-text { flex:1; }
  .no-task { font-size:13px; color:var(--text-muted); font-style:italic; padding:4px 0; }
  .expand-hint {
    font-size:11px; color:var(--text-muted); text-align:center;
    padding:6px 0 10px; cursor:pointer;
  }
  .expand-hint:hover { color:var(--brand); }
  .card-notes {
    margin-top:10px; font-size:12px; color:var(--text-secondary); line-height:1.6;
  }

  /* Overlay / Detail */
  .overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.4);
    z-index:1000; justify-content:center; align-items:flex-start;
    padding:40px 16px; overflow-y:auto;
  }
  .overlay.show { display:flex; }
  .detail-panel {
    background:var(--card); border-radius:var(--radius); max-width:600px;
    width:100%; box-shadow:var(--shadow-lg); overflow:hidden;
    animation:slideUp .25s ease;
  }
  @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)} }
  .detail-header {
    padding:20px 24px 16px; border-bottom:1px solid var(--divider);
    display:flex; align-items:flex-start; justify-content:space-between;
  }
  .detail-header h3 { font-size:18px; font-weight:700; }
  .detail-header .meta { font-size:12px; color:var(--text-secondary); margin-top:4px; }
  .detail-close {
    width:32px; height:32px; border-radius:50%; border:none;
    background:#F3F4F6; cursor:pointer; font-size:16px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:background .15s;
  }
  .detail-close:hover { background:#E5E7EB; }
  .detail-body { padding:20px 24px; }
  .detail-section { margin-bottom:20px; }
  .detail-section:last-child { margin-bottom:0; }
  .detail-section h4 {
    font-size:13px; font-weight:700; color:var(--text-secondary);
    text-transform:uppercase; letter-spacing:.5px; margin-bottom:10px;
  }
  .detail-task {
    display:flex; align-items:flex-start; gap:10px; padding:8px 0;
    border-bottom:1px solid #F3F4F6; font-size:14px; cursor:pointer;
  }
  .detail-task:last-child { border-bottom:none; }
  .detail-task .dt-checkbox {
    width:18px; height:18px; border-radius:4px; border:2px solid var(--divider);
    flex-shrink:0; margin-top:1px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s;
  }
  .detail-task .dt-checkbox:hover { border-color:var(--brand); }
  .detail-task .dt-checkbox.checked { background:var(--brand); border-color:var(--brand); }
  .detail-task .dt-checkbox.checked::after { content:'✓'; color:#fff; font-size:11px; font-weight:700; }
  .detail-task.done .dt-text { text-decoration:line-through; color:var(--text-muted); }
  .detail-task .dt-text { flex:1; }
  .detail-progress-table { width:100%; border-collapse:collapse; font-size:13px; }
  .detail-progress-table th {
    text-align:left; padding:8px 10px; background:#F9FAFB;
    font-weight:600; font-size:12px; color:var(--text-secondary);
    border-bottom:1px solid var(--divider);
  }
  .detail-progress-table td { padding:8px 10px; border-bottom:1px solid #F3F4F6; }
  .status-tag {
    display:inline-flex; align-items:center; gap:4px;
    padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600;
  }
  .st-signed { background:var(--success-light); color:#16A34A; }
  .st-pending { background:var(--warning-light); color:#D97706; }
  .sep { height:1px; background:var(--divider); margin:8px 0 20px; }

  /* Setup & Settings Modal */
  .modal-overlay {
    display:none; position:fixed; inset:0; background:rgba(0,0,0,.5);
    z-index:2000; justify-content:center; align-items:center; padding:16px;
  }
  .modal-overlay.show { display:flex; }
  .modal-box {
    background:var(--card); border-radius:var(--radius); padding:28px;
    max-width:400px; width:100%; box-shadow:var(--shadow-lg);
    animation:slideUp .25s ease;
  }
  .modal-box h3 { font-size:17px; font-weight:700; margin-bottom:8px; }
  .modal-box p { font-size:13px; color:var(--text-secondary); margin-bottom:16px; line-height:1.6; }
  .modal-box input {
    width:100%; padding:10px 12px; border:1.5px solid var(--divider);
    border-radius:var(--radius-sm); font-size:14px; outline:none;
    transition:border-color .15s;
  }
  .modal-box input:focus { border-color:var(--brand); }
  .modal-btns { display:flex; gap:8px; margin-top:16px; justify-content:flex-end; }
  .modal-btns button {
    padding:8px 20px; border-radius:var(--radius-sm); font-size:14px;
    font-weight:600; cursor:pointer; border:1.5px solid var(--divider);
    background:var(--card); color:var(--text-secondary); transition:all .15s;
  }
  .modal-btns button:hover { border-color:var(--brand); color:var(--brand); }
  .modal-btns button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  .modal-btns button.primary:hover { opacity:.9; }
  .setup-status { font-size:12px; margin-top:8px; min-height:18px; }
  .setup-status.ok { color:var(--success); }
  .setup-status.err { color:var(--danger); }

  /* Sync Bar */
  .sync-bar {
    position:fixed; bottom:0; left:0; right:0;
    background:rgba(255,255,255,.95); backdrop-filter:blur(8px);
    border-top:1px solid var(--divider); padding:6px 16px;
    font-size:11px; color:var(--text-muted); text-align:center;
    z-index:500; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .sync-dot { width:6px; height:6px; border-radius:50%; display:inline-block; }
  .sync-dot.ok { background:var(--success); }
  .sync-dot.saving { background:var(--warning); animation:pulse .8s infinite; }
  .sync-dot.err { background:var(--danger); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* Loading */
  .loading {
    text-align:center; padding:60px 20px; color:var(--text-muted); font-size:15px;
  }
  .loading-spinner {
    width:32px; height:32px; border:3px solid var(--divider);
    border-top-color:var(--brand); border-radius:50%;
    animation:spin .8s linear infinite; margin:0 auto 16px;
  }
  @keyframes spin { to{transform:rotate(360deg)} }

  /* Responsive */
  @media (max-width:768px) {
    .stats-row { grid-template-columns:repeat(2,1fr); gap:8px; }
    .group-content { grid-template-columns:1fr; }
    .stat-card .value { font-size:22px; }
  }
  @media (max-width:480px) {
    .app { padding:14px 10px 80px; }
    .header h1 { font-size:18px; }
    .detail-panel { margin:16px; }
    .detail-header { padding:16px; }
    .detail-body { padding:16px; }
  }
  @media print {
    body { background:#fff; }
    .overlay,.modal-overlay,.sync-bar { display:none!important; }
    .p-card-body { max-height:none!important; padding:0 16px 14px!important; }
    .group-content { max-height:none!important; opacity:1!important; }
  }
</style>
</head>

<!-- Loading -->
<div class="loading" id="loadingView">
  <div class="loading-spinner"></div>
  正在加载数据...
</div>

<!-- Setup Modal -->
<div class="modal-overlay" id="setupModal">
  <div class="modal-box">
    <h3>🔑 连接 GitHub</h3>
    <p>请输入你的 GitHub Personal Access Token，用于同步看板数据。<br>Token 仅保存在你的浏览器本地。</p>
    <input type="password" id="setupTokenInput" placeholder="ghp_xxxxxxxxxxxx">
    <div class="setup-status" id="setupStatus"></div>
    <div class="modal-btns">
      <button onclick="closeSetup()">取消</button>
      <button class="primary" onclick="verifyAndSaveToken()">验证并保存</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-box">
    <h3>⚙️ 设置</h3>
    <p>GitHub Token（用于同步打勾状态）</p>
    <input type="password" id="settingsTokenInput" placeholder="ghp_xxxxxxxxxxxx">
    <div class="setup-status" id="settingsStatus"></div>
    <div class="modal-btns">
      <button onclick="clearToken()" style="color:var(--danger);border-color:var(--danger);">清除 Token</button>
      <button onclick="closeSettings()">关闭</button>
      <button class="primary" onclick="updateToken()">保存</button>
    </div>
  </div>
</div>

<!-- Main App -->
<main class="app" id="mainApp" style="display:none;">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <h1>工作日程</h1>
      <div class="date" id="headerDate"></div>
    </div>
    <div class="header-right">
      <button class="icon-btn" onclick="openSettings()" title="设置">⚙</button>
      <a class="cal-link" href="https://mi1kshake9124.github.io/cal-schedule/" target="_blank" rel="noopener noreferrer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        日历视图
      </a>
    </div>
  </div>

  <!-- Dynamic Content -->
  <div id="boardContent"></div>
</main>

<!-- Detail Overlay -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeDetail()">
  <div class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <div>
        <h3 id="detailTitle"></h3>
        <div class="meta" id="detailMeta"></div>
      </div>
      <button class="detail-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="detail-body" id="detailBody"></div>
  </div>
</div>

<!-- Sync Bar -->
<div class="sync-bar" id="syncBar">
  <span class="sync-dot ok" id="syncDot"></span>
  <span id="syncText">就绪</span>
</div>

<script>
// ======================== Config ========================
const GITHUB_OWNER = 'mi1kshake9124';
const GITHUB_REPO = 'work-schedule';
const DATA_FILE = 'data.json';
const COMPLETED_FILE = 'completed.json';

// ======================== State ========================
let projectData = null;
let completed = new Set();
let currentTab = 'all';

// ======================== GitHub API ========================
function getToken() { return localStorage.getItem('github_pat') || ''; }

async function ghFetch(path, token) {
  const h = token ? {'Authorization':'token '+token} : {};
  const r = await fetch('https://api.github.com/repos/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/contents/'+path, {headers:h});
  if (!r.ok) throw new Error(r.status);
  return await r.json();
}

async function ghPut(path, content, message, sha, token) {
  const r = await fetch('https://api.github.com/repos/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/contents/'+path, {
    method:'PUT',
    headers:{'Authorization':'token '+token,'Content-Type':'application/json'},
    body:JSON.stringify({message,content,sha,branch:'main'})
  });
  if (!r.ok) { const t=await r.text(); throw new Error(r.status+': '+t); }
  return await r.json();
}

async function loadData() {
  // 1. Try embedded data first (always works, no network needed)
  const embedded = document.getElementById('embedded-data');
  if (embedded) {
    projectData = JSON.parse(embedded.textContent);
  }
  // 2. Try fetching fresh data from GitHub (for latest updates)
  try {
    const rawBase = 'https://raw.githubusercontent.com/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/main/';
    const dataResp = await fetch(rawBase + DATA_FILE + '?t=' + Date.now());
    if (dataResp.ok) { projectData = await dataResp.json(); }
  } catch(e) { /* use embedded data */ }
  if (!projectData) throw new Error('数据加载失败');
  // 3. Load completed status
  try {
    const rawBase2 = 'https://raw.githubusercontent.com/'+GITHUB_OWNER+'/'+GITHUB_REPO+'/main/';
    const compResp = await fetch(rawBase2 + COMPLETED_FILE + '?t=' + Date.now());
    if (compResp.ok) {
      const arr = await compResp.json();
      completed = new Set(Array.isArray(arr) ? arr : []);
    } else { completed = new Set(); }
  } catch(e) { completed = new Set(); }
}

async function saveCompleted() {
  const token = getToken();
  if (!token) {
    setSync('err','⚠ 请先点右上角⚙设置Token');
    localStorage.setItem('completed_local',JSON.stringify([...completed]));
    return;
  }
  setSync('saving','同步中...');
  let sha = '';
  let step = '获取SHA';
  try {
    const cur = await ghFetch(COMPLETED_FILE, token);
    sha = cur.sha;
    step = '写入数据';
    const arr = [...completed];
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(arr,null,2))));
    await ghPut(COMPLETED_FILE, content, '更新完成状态', sha, token);
    localStorage.setItem('completed_local',JSON.stringify(arr));
    const now = new Date();
    setSync('ok','已同步 '+now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0'));
  } catch(e) {
    setSync('err',' '+step+'失败: '+e.message);
    localStorage.setItem('completed_local',JSON.stringify([...completed]));
  }
}

function setSync(state, text) {
  const dot = document.getElementById('syncDot');
  const txt = document.getElementById('syncText');
  dot.className = 'sync-dot '+state;
  txt.textContent = text;
}

// ======================== Date Utils ========================
function todayStr() {
  const n=new Date(); return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')+'-'+String(n.getDate()).padStart(2,'0');
}
function fmtDate(dateStr) {
  if (!dateStr) return {label:'待定',cls:'d-later'};
  const today=new Date(); today.setHours(0,0,0,0);
  const d=new Date(dateStr+'T00:00:00'); 
  const diff=Math.round((d-today)/864e5);
  const mm=d.getMonth()+1, dd=d.getDate();
  const ds=mm+'/'+dd;
  if (diff===0) return {label:'今天 '+mm+'/'+dd, cls:'d-today'};
  if (diff===1) return {label:'明天 '+ds, cls:'d-tomorrow'};
  if (diff>1 && diff<=6) {
    const wd=['周日','周一','周二','周三','周四','周五','周六'];
    return {label:wd[d.getDay()]+' '+ds, cls:'d-week'};
  }
  if (diff>0 && diff<=10) {
    const todayD=today.getDay(); const tgtD=d.getDay();
    if (tgtD===0||tgtD===6) return {label:'周末 '+ds, cls:'d-week'};
  }
  if (diff<0) return {label:ds+' (已过)', cls:'d-later'};
  if (mm<=today.getMonth()+1) return {label:ds, cls:'d-later'};
  return {label:mm+'月'+dd+'日', cls:'d-later'};
}

// ======================== Render ========================
function render() {
  if (!projectData) return;
  const today = todayStr();
  const projs = projectData.projects;
  const todayD = new Date(); todayD.setHours(0,0,0,0);
  const weekEnd = new Date(todayD); weekEnd.setDate(weekEnd.getDate()+6);

  // Date header
  const wd=['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
  const td=new Date();
  document.getElementById('headerDate').textContent = td.getFullYear()+'年'+(td.getMonth()+1)+'月'+td.getDate()+'日 '+wd[td.getDay()];

  // Categorize
  const signed=[], unsigned=[];
  let cntConst=0, cntDes=0, cntIdle=0;
  const todayTasks=[], weekTasks=[];

  for (const [k,p] of Object.entries(projs)) {
    if (p.status==='未签合同') { unsigned.push([k,p]); }
    else {
      signed.push([k,p]);
      if (p.status==='施工中') cntConst++;
      else if (p.status==='设计中') cntDes++;
      else cntIdle++;
    }
    for (const t of p.tasks) {
      if (!t.date) { weekTasks.push({project:p.name,taskId:t.id,text:t.text,date:'',dateType:'d-later'}); continue; }
      const td2=new Date(t.date+'T00:00:00');
      if (t.date===today) todayTasks.push({project:p.name,taskId:t.id,text:t.text,date:t.date});
      if (td2>=todayD && td2<=weekEnd) {
        const df=fmtDate(t.date);
        weekTasks.push({project:p.name,taskId:t.id,text:t.text,date:t.date,dateType:df.cls});
      }
    }
  }
  weekTasks.sort((a,b)=>{if(!a.date)return 1;if(!b.date)return -1;return a.date.localeCompare(b.date);});

  // Build HTML
  let html = '';

  // Stats
  html += '<div class="stats-row">';
  html += '<div class="stat-card" onclick="statClick(\'signed\')"><div class="label">已签约</div><div class="value">'+signed.length+'</div><div class="sub">施工'+cntConst+' · 设计'+cntDes+' · 未设计'+cntIdle+'</div></div>';
  html += '<div class="stat-card" onclick="statClick(\'unsigned\')"><div class="label">未签合同</div><div class="value">'+unsigned.length+'</div><div class="sub">跟进中</div></div>';
  html += '<div class="stat-card" onclick="statClick(\'today\')"><div class="label">今日待办</div><div class="value" style="color:var(--danger)">'+todayTasks.length+'</div><div class="sub">跨 '+new Set(todayTasks.map(t=>t.project)).size+' 个项目</div></div>';
  html += '<div class="stat-card" onclick="openWeekView()"><div class="label">本周待办</div><div class="value">'+weekTasks.length+'</div><div class="sub">截至周日</div></div>';
  html += '</div>';

  // Today Panel
  html += '<div class="today-panel"><div class="today-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>今日待办（'+(td.getMonth()+1)+'月'+td.getDate()+'日）</div>';
  html += '<div class="today-items" id="todayItems">';
  if (todayTasks.length===0) {
    html += '<div class="today-empty">🎉 今天没有待办事项</div>';
  } else {
    for (const t of todayTasks) {
      const done=completed.has(t.taskId);
      const shortName=t.project.split(' ')[0].split('·').slice(-1)[0];
      html += '<div class="today-item'+(done?' done':'')+'" onclick="toggleTask(\''+t.taskId+'\',this)"><div class="ti-icon'+(done?' checked':'')+'"></div><div><div class="ti-project">'+shortName+'</div><div class="ti-task">'+t.text+'</div></div></div>';
    }
  }
  html += '</div></div>';

  // Tabs
  html += '<div class="tab-bar" id="tabBar">';
  html += '<button class="tab-btn'+(currentTab==='all'?' active':'')+'" data-tab="all">全部项目</button>';
  html += '<button class="tab-btn'+(currentTab==='signed'?' active':'')+'" data-tab="signed">已签约</button>';
  html += '<button class="tab-btn'+(currentTab==='unsigned'?' active':'')+'" data-tab="unsigned">未签合同</button>';
  html += '</div>';

  // Signed Projects
  const groups = [['施工中','dot-construction',cntConst],['设计中','dot-design',cntDes],['未设计','dot-idle',cntIdle]];
  html += '<div class="section" id="section-signed" style="'+(currentTab==='unsigned'?'display:none':'')+'">';
  html += '<div class="section-head"><h2>已签约项目</h2><span class="badge" style="background:var(--success-light);color:#16A34A;">'+signed.length+'</span></div>';
  for (const [gName,gDot,gCnt] of groups) {
    const gProjs = signed.filter(([,p])=>p.status===gName);
    if (gProjs.length===0) continue;
    html += '<div class="group-header" onclick="toggleGroup(this)"><span class="group-dot '+gDot+'"></span><span class="group-name">'+gName+'</span><span class="group-count">'+gCnt+'个项目</span><span class="group-arrow">▼</span></div>';
    html += '<div class="group-content">';
    for (const [k,p] of gProjs) {
      html += renderCard(k, p, false);
    }
    html += '</div>';
  }
  html += '</div>';

  html += '<div class="sep" style="'+(currentTab!=='all'?'display:none':'')+'"></div>';

  // Unsigned Projects
  html += '<div class="section" id="section-unsigned" style="'+(currentTab==='signed'?'display:none':'')+'">';
  html += '<div class="section-head"><h2>未签合同项目</h2><span class="badge" style="background:var(--warning-light);color:#D97706;">'+unsigned.length+'</span></div>';
  html += '<div class="group-content">';
  for (const [k,p] of unsigned) {
    html += renderCard(k, p, true);
  }
  html += '</div></div>';

  document.getElementById('boardContent').innerHTML = html;

  // Bind tab events
  document.getElementById('tabBar').addEventListener('click', function(e) {
    if (!e.target.classList.contains('tab-btn')) return;
    currentTab = e.target.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById('section-signed').style.display = (currentTab==='unsigned')?'none':'';
    document.getElementById('section-unsigned').style.display = (currentTab==='signed')?'none':'';
    document.querySelector('.sep').style.display = (currentTab==='all')?'':'none';
  });
}

function renderCard(key, p, isUnsigned) {
  let h = '<div class="p-card"><div class="p-card-head" onclick="openDetail(\''+key+'\')">';
  h += '<div class="p-name">'+p.name+'</div>';
  if (isUnsigned) {
    h += '<span class="p-agent" style="background:var(--brand-light);color:var(--brand);">'+p.agent+'</span>';
  } else if (p.agent && p.agent!=='—') {
    h += '<span class="p-agent">'+p.agent+'</span>';
  }
  h += '</div>';
  h += '<div class="p-card-body" id="body-'+key+'"><ul class="task-list">';
  if (p.tasks.length===0) {
    h += '<li class="task-item"><span class="no-task">暂无待办事项</span></li>';
  } else {
    for (const t of p.tasks) {
      const df = fmtDate(t.date);
      const done = completed.has(t.id);
      h += '<li class="task-item'+(done?' done':'')+'" onclick="toggleTask(\''+t.id+'\',this)"><div class="task-checkbox'+(done?' checked':'')+'"></div><span class="task-date '+df.cls+'">'+df.label+'</span><span class="task-text">'+t.text+'</span></li>';
    }
  }
  h += '</ul>';
  if (p.notes) h += '<div class="card-notes">'+p.notes+'</div>';
  h += '</div>';
  if (p.tasks.length>0) h += '<div class="expand-hint" onclick="toggleBody(\''+key+'\',this)">展开详情 ▾</div>';
  h += '</div>';
  return h;
}

// ======================== Interactions ========================
function toggleTask(taskId, el) {
  if (completed.has(taskId)) { completed.delete(taskId); }
  else { completed.add(taskId); }
  // Update all matching elements
  const done = completed.has(taskId);
  document.querySelectorAll('[onclick*="\''+taskId+'\'"]').forEach(elem => {
    elem.classList.toggle('done', done);
    const cb = elem.querySelector('.task-checkbox, .ti-icon');
    if (cb) cb.classList.toggle('checked', done);
  });
  saveCompleted();
}

function toggleBody(key, hint) {
  const body = document.getElementById('body-'+key);
  if (!body) return;
  if (body.classList.contains('open')) {
    body.classList.remove('open'); hint.textContent='展开详情 ▾';
  } else {
    body.classList.add('open'); hint.textContent='收起 ▴';
  }
}

function toggleGroup(header) {
  header.classList.toggle('collapsed');
  const content = header.nextElementSibling;
  content.classList.toggle('hidden');
}

function statClick(type) {
  if (type==='signed') {
    currentTab='signed';
  } else if (type==='unsigned') {
    currentTab='unsigned';
  } else if (type==='today') {
    document.querySelector('.today-panel').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  // Re-render tabs
  document.querySelectorAll('.tab-btn').forEach(b=>{b.classList.remove('active');if(b.dataset.tab===currentTab)b.classList.add('active');});
  document.getElementById('section-signed').style.display=(currentTab==='unsigned')?'none':'';
  document.getElementById('section-unsigned').style.display=(currentTab==='signed')?'none':'';
  document.querySelector('.sep').style.display=(currentTab==='all')?'':'none';
  const target = currentTab==='unsigned' ? document.getElementById('section-unsigned') : document.getElementById('section-signed');
  if (target) target.scrollIntoView({behavior:'smooth',block:'start'});
}

// ======================== Detail Modal ========================
function openDetail(key) {
  const p = projectData.projects[key];
  if (!p) return;
  const isUnsigned = p.status==='未签合同';
  document.getElementById('detailTitle').textContent = p.name;
  const stClass = isUnsigned?'st-pending':'st-signed';
  document.getElementById('detailMeta').innerHTML = '<span class="status-tag '+stClass+'">'+p.status+'</span> · 业务员：'+p.agent;

  let html = '';
  // Tasks
  html += '<div class="detail-section"><h4>待办事项</h4>';
  if (p.tasks.length===0) {
    html += '<div class="no-task">暂无待办事项</div>';
  } else {
    for (const t of p.tasks) {
      const df = fmtDate(t.date);
      const done = completed.has(t.id);
      html += '<div class="detail-task'+(done?' done':'')+'" onclick="toggleTask(\''+t.id+'\',this)"><div class="dt-checkbox'+(done?' checked':'')+'"></div><span class="task-date '+df.cls+'">'+df.label+'</span><span class="dt-text">'+t.text+'</span></div>';
    }
  }
  html += '</div>';

  // Progress table
  if (p.progress && p.progress.length>0) {
    html += '<div class="detail-section"><h4>项目进度</h4>';
    html += '<table class="detail-progress-table"><thead><tr><th>分类</th><th>任务</th><th>日期</th></tr></thead><tbody>';
    for (const r of p.progress) {
      html += '<tr><td>'+r.cat+'</td><td>'+r.task+'</td><td>'+r.date+'</td></tr>';
    }
    html += '</tbody></table></div>';
  }

  // Notes
  if (p.notes) {
    html += '<div class="detail-section"><h4>项目备注</h4>';
    html += '<div style="font-size:13px;color:var(--text-secondary);line-height:1.7;">'+p.notes+'</div></div>';
  }

  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('overlay').classList.remove('show');
  document.body.style.overflow = '';
}

function openWeekView() {
  const todayD = new Date(); todayD.setHours(0,0,0,0);
  const weekEnd = new Date(todayD); weekEnd.setDate(weekEnd.getDate()+6);
  const projs = projectData.projects;
  const allTasks = [];
  for (const [k,p] of Object.entries(projs)) {
    for (const t of p.tasks) {
      if (!t.date) { allTasks.push({project:p.name,text:t.text,date:'',sortKey:'9999'}); continue; }
      const td=new Date(t.date+'T00:00:00');
      if (td>=todayD && td<=weekEnd) {
        allTasks.push({project:p.name,text:t.text,date:t.date,sortKey:t.date});
      }
    }
  }
  allTasks.sort((a,b)=>a.sortKey.localeCompare(b.sortKey));

  // Group by date
  const byDate = {};
  for (const t of allTasks) {
    const label = t.date ? fmtDate(t.date).label : '待定';
    if (!byDate[label]) byDate[label]=[];
    byDate[label].push(t);
  }

  document.getElementById('detailTitle').textContent = '本周待办总览';
  document.getElementById('detailMeta').innerHTML = '共 '+allTasks.length+' 项任务';

  let html = '';
  for (const [label,items] of Object.entries(byDate)) {
    html += '<div class="detail-section"><h4>'+label+'</h4>';
    for (const it of items) {
      const shortName = it.project.split(' ')[0].split('·').slice(-1)[0];
      html += '<div class="detail-task"><span class="task-date d-week" style="min-width:auto;font-size:10px;">'+shortName+'</span><span class="dt-text">'+it.text+'</span></div>';
    }
    html += '</div>';
  }

  document.getElementById('detailBody').innerHTML = html;
  document.getElementById('overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

// ======================== Settings / Setup ========================
function openSetup() {
  document.getElementById('setupTokenInput').value = '';
  document.getElementById('setupStatus').textContent = '';
  document.getElementById('setupModal').classList.add('show');
}
function closeSetup() { document.getElementById('setupModal').classList.remove('show'); }

async function verifyAndSaveToken() {
  const input = document.getElementById('setupTokenInput');
  const status = document.getElementById('setupStatus');
  const token = input.value.trim();
  if (!token) { status.textContent='请输入 Token'; status.className='setup-status err'; return; }
  status.textContent = '验证中...'; status.className='setup-status';
  try {
    const r = await fetch('https://api.github.com/user', {headers:{'Authorization':'token '+token}});
    if (!r.ok) throw new Error('invalid');
    const user = await r.json();
    status.textContent = '✓ 验证成功：'+user.login; status.className='setup-status ok';
    localStorage.setItem('github_pat', token);
    setTimeout(async ()=>{
      closeSetup();
      try { await init(); } catch(e) { status.textContent='加载失败'; status.className='setup-status err'; }
    }, 600);
  } catch(e) {
    status.textContent='✗ Token 无效，请检查后重试'; status.className='setup-status err';
  }
}

function openSettings() {
  document.getElementById('settingsTokenInput').value = getToken();
  document.getElementById('settingsStatus').textContent = '';
  document.getElementById('settingsModal').classList.add('show');
}
function closeSettings() { document.getElementById('settingsModal').classList.remove('show'); }
function updateToken() {
  const token = document.getElementById('settingsTokenInput').value.trim();
  const status = document.getElementById('settingsStatus');
  if (!token) { status.textContent='请输入Token'; status.className='setup-status err'; return; }
  status.textContent='验证中...'; status.className='setup-status';
  fetch('https://api.github.com/user', {headers:{'Authorization':'token '+token}})
    .then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(user => {
      localStorage.setItem('github_pat', token);
      status.textContent='✓ 验证成功：'+user.login; status.className='setup-status ok';
      setSync('ok','Token 已验证保存');
      setTimeout(closeSettings, 1000);
    })
    .catch(e => {
      status.textContent='✗ Token无效('+e.message+')，请重新输入'; status.className='setup-status err';
    });
}
function clearToken() {
  localStorage.removeItem('github_pat');
  closeSettings();
  setSync('err','Token 已清除');
}

// ======================== Init ========================
async function init() {
  try {
    await loadData();
    // Restore local completions if no token
    if (!getToken()) {
      try {
        const local = JSON.parse(localStorage.getItem('completed_local')||'[]');
        local.forEach(id=>completed.add(id));
      } catch(e){}
    }
    document.getElementById('loadingView').style.display='none';
    document.getElementById('mainApp').style.display='';
    render();
    setSync('ok','已加载');
  } catch(e) {
    document.getElementById('loadingView').innerHTML = '<div style="font-size:16px;margin-bottom:8px;">加载失败</div><div style="font-size:13px;color:var(--text-secondary);">'+e.message+'</div><button onclick="location.reload()" style="margin-top:16px;padding:10px 24px;border-radius:8px;background:var(--brand);color:#fff;border:none;font-size:14px;font-weight:600;cursor:pointer;">重试</button>';
  }
}

// ESC to close
document.addEventListener('keydown', function(e) { if(e.key==='Escape'){closeDetail();closeSetup();closeSettings();} });

// Start
init();
</script>
</body>
</html>
